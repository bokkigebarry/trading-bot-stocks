# Daily paper-trading run in the cloud.
# Runs on GitHub's servers, so the home PC can stay off. The trade journal
# (bot_data/journal.db) is committed back to the repo after every run —
# that file IS the bot's memory and portfolio, so it must persist.
name: Daily paper trading

on:
  schedule:
    # 22:00 UTC = 23:00/24:00 Dutch time — always after the US close,
    # whatever the season (GitHub cron is in UTC).
    - cron: "0 22 * * 1-5"
  workflow_dispatch: {}   # allows manual runs from the Actions tab

jobs:
  paper:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Run daily paper-trading step
        run: python -m bot paper

      - name: Commit updated journal and dashboard
        run: |
          git config user.name "trading-bot"
          git config user.email "trading-bot@users.noreply.github.com"
          git add bot_data/journal.db bot_data/dashboard.html docs/index.html
          git diff --cached --quiet || git commit -m "paper run $(date -u +%Y-%m-%d)"
          git push
# registered 2026-06-11
